<!DOCTYPE html>
<html lang="{{ .Language.Lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} - {{ .Site.Title }}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.6; max-width: 900px; margin: 0 auto; padding: 20px; }
    h1, h2, h3 { color: #2c3e50; }
    img { max-width: 100%; height: auto; border-radius: 8px; margin: 15px 0; }
    button { background: #4CAF50; color: white; padding: 10px 20px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; }
    button:nth-child(2) { background: #2196F3; }
    .books { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); margin-top: 20px; }
    .book { border: 1px solid #ddd; padding: 15px; border-radius: 10px; text-align: center; background: #f9f9f9; }
    .book img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
    a { text-decoration: none; color: #0066cc; }
  </style>
</head>
<body>
  {{ block "main" . }}{{ end }}
</body>
</html>
