<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} - Детские аудиокниги</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; background: #f8f9fa; }
    h1 { color: #2c3e50; text-align: center; }
    img { max-width: 100%; border-radius: 12px; margin: 20px 0; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .text { background: white; padding: 20px; border-radius: 10px; margin: 15px 0; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .text h3 { margin-top: 0; color: #4CAF50; }
    .text:nth-child(3) h3 { color: #2196F3; }
    button { background: #4CAF50; color: white; border: none; padding: 12px 24px; margin: 8px; border-radius: 8px; cursor: pointer; font-size: 1em; }
    button:nth-child(2) { background: #2196F3; }
    button:hover { opacity: 0.9; }
    .back { display: block; text-align: center; margin: 30px 0; color: #666; }
  </style>
</head>
<body>
  <h1>{{ .Title }}</h1>

  {{ with .Params.image }}
    <img src="{{ . }}" alt="Иллюстрация">
  {{ end }}

  <div class="text">
    <h3>Қазақша</h3>
    <p>{{ .Params.text_kz }}</p>
  </div>

  <div class="text">
    <h3>English</h3>
    <p>{{ .Params.text_en }}</p>
  </div>

  <div style="text-align:center;">
    <button onclick="play('kz')">Озвучить на казахском</button>
    <button onclick="play('en')">Play in English</button>
  </div>

  <audio id="audio-kz"><source src="{{ .Params.audio_kz }}" type="audio/mpeg"></audio>
  <audio id="audio-en"><source src="{{ .Params.audio_en }}" type="audio/mpeg"></audio>

  <p class="back"><a href="/">&larr; На главную</a></p>

  <script>
    function play(lang) {
      const audio = document.getElementById('audio-' + lang);
      audio.currentTime = 0;
      audio.play().catch(() => {});
    }
  </script>
</body>
</html>
