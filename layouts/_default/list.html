{{ define "main" }}
<div class="universal-wrapper">
  <h1>{{ .Title }}</h1>
  <div class="content">
    {{ .Content }}
    <ul style="list-style:none; padding:0;">
      {{ range where .Pages "Section" "" }}
        <li style="margin:10px 0;"><a href="{{ .Permalink }}" style="text-decoration:none; color:#2196F3;">{{ .Title }}</a></li>
      {{ end }}
    </ul>
  </div>
</div>
{{ end }}
