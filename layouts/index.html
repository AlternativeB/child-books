{{ define "main" }}
  <h1>{{ .Site.Title }}</h1>
  <p>{{ .Site.Params.description }}</p>

  <div class="books">
    {{ range where .Site.RegularPages "Section" "books" }}
      {{ if .Params.cover }}
        <div class="book">
          <a href="{{ .Permalink }}">
            <img src="{{ .Params.cover }}" alt="{{ .Title }}">
            <h3>{{ .Title }}</h3>
            <p>{{ .Params.description }}</p>
          </a>
        </div>
      {{ end }}
    {{ end }}
  </div>
{{ end }}
